# managed-by: codument (hooks install --ci) — delete this line to take ownership;
# codument will then refuse to overwrite your edits.
name: codument

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: strict step-sync gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Verify documentation and portable review evidence
        env:
          CODUMENT_BASE: origin/${{ github.base_ref }}
        run: npx --no-install codument review --strict --base "$CODUMENT_BASE" --committed --require-review --review-file .codument-review.json

      # Before delivery, review the complete branch with --base <ref> --pending,
      # then export and stage .codument-review.json with the final changes.
      # Missing or stale evidence fails; a local step receipt cannot cover a PR.

      # Want inline PR annotations? Swap the step above for the SARIF recipe in
      # the codument README ("CI" section) — same verdict, rendered on the diff.
      # Make this check REQUIRED via branch protection to turn the gate into a
      # merge blocker: Settings → Branches → require the "strict step-sync gate"
      # status check.
